name: Pruebas RADAR
on:
  push:
    branches:
      - feature/importacion-candidatos-sin-bloqueos
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_dev_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Comprobar configuración y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Ejecutar pruebas de importación
        run: python manage.py test talento.test_reglas_importacion talento.test_flujo_importacion talento.test_rut_importacion --verbosity 2
