<!DOCTYPE html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RADAR | Nueva vacante</title><style>body{margin:0;background:#f3f5f8;color:#182b3a;font-family:Arial,sans-serif}.barra{background:#142f40;color:#fff;padding:18px 28px}.barra a{color:#fff}main{max-width:900px;margin:auto;padding:32px 24px}.tarjeta{background:#fff;border:1px solid #dce3ea;border-radius:12px;padding:24px}.campo{margin-bottom:16px}.campo label{display:block;margin-bottom:5px}.campo input,.campo select,.campo textarea{width:100%;padding:10px;border:1px solid #aab8c4;border-radius:7px;font:inherit;box-sizing:border-box}.errorlist{color:#a32635}.boton{background:#164b63;color:#fff;padding:10px 16px;border-radius:8px;border:0;text-decoration:none;font:inherit}</style></head><body><header class="barra"><strong>RADAR</strong> · <a href="{% url 'seleccion_vacantes' %}">Selección</a></header><main><h1>Nueva vacante</h1><div class="tarjeta"><form method="post">{% csrf_token %}{{ formulario.non_field_errors }}{% for campo in formulario %}<div class="campo">{{ campo.label_tag }}{{ campo }}{{ campo.errors }}</div>{% endfor %}<button class="boton" type="submit">Guardar vacante</button> <a href="{% url 'seleccion_vacantes' %}">Cancelar</a></form></div></main></body></html>
